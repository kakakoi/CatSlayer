name: Temporary dependency security lockfile refresh
on:
  push:
    branches:
      - security/fix-npm-audit-20261009
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve available npm security fixes (no install scripts)
        run: |
          npm audit fix --package-lock-only --ignore-scripts --audit-level=high || true
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high || true
      - name: Verify install and build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run health-check
      - name: Commit only resolved dependencies and remove temporary workflow
        if: always()
        run: |
          git config user.name "security-remediation[bot]"
          git config user.email "security-remediation[bot]@users.noreply.github.com"
          rm -f .github/workflows/_security-lock-refresh.yml
          git add -A package.json package-lock.json .github/workflows/_security-lock-refresh.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: refresh vulnerable npm dependencies"
            git push origin HEAD:security/fix-npm-audit-20261009
          fi
